name: Planner
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
targets:
  Planner:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: generated/web
        type: folder
        buildPhase: resources
      - path: generated/local-models.json
        buildPhase: resources
      - path: generated/device-bridge.js
        buildPhase: resources
      - path: generated/Assets.xcassets
        buildPhase: resources
    info:
      path: generated/Planner-Info.plist
      properties:
        CFBundleDisplayName: Планер
        CFBundleDevelopmentRegion: ru
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Планер записывает голосовые заметки о делах.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Plan
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Planner
        PRODUCT_BUNDLE_IDENTIFIER: app.planner.personal.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_LANGUAGE: ru
        SUPPORTS_MACCATALYST: false
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/engines/PlannerVoice.h
        LIBRARY_SEARCH_PATHS: $(inherited) "$(PROJECT_DIR)/generated/lib/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: $(inherited) -lPlannerVoice -lc++ -framework Accelerate -framework Metal -framework MetalKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Planner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.planner.personal.ios.uitests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Planner:
    build:
      targets:
        Planner: all
        PlannerUITests: [test]
    test:
      targets: [PlannerUITests]
