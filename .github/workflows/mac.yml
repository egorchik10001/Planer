name: Mac app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:desktop
      - run: node --test tests/domain.test.mjs tests/outbox.test.mjs tests/offline-spaces.test.mjs
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: Planner-mac
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
